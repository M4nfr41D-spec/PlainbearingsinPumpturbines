<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOISSNER RF-PGV TOOL · Source-Constrained Candidate</title>
<style>
  html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#1a1d21;color:#fff}
  .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .boot-card{max-width:620px}.mark{width:42px;height:42px;border:3px solid #F68F1E;border-radius:50%;margin:0 auto 16px}
  h1{font-size:20px;font-weight:600;margin:0 0 8px}p{opacity:.72;line-height:1.5;font-size:13px}.err{color:#ff9b8a;white-space:pre-wrap}
</style>
</head>
<body>
<div class="boot"><div class="boot-card"><div class="mark"></div><h1>RF-PGV source-constrained runtime</h1><p id="bootMsg">Loading frozen UI base + governed engineering runtime…</p></div></div>
<script>
(async function(){
  const base = './runtime/base/index_pre_source_constrained_2026-10-01.html';
  const injection = [
    '<script src="./runtime/rfpgv_source_data_v1.js"><\\/script>',
    '<script src="./runtime/rfpgv_force_pressure_bridge_v2.js"><\\/script>',
    '<script src="./runtime/rfpgv_runtime_integration_v1.js"><\\/script>'
  ].join('\\n');
  try {
    const res = await fetch(base, {cache:'no-store'});
    if (!res.ok) throw new Error('Base UI fetch failed: HTTP ' + res.status);
    let html = await res.text();
    if (!html.includes('</body>')) throw new Error('Frozen base is missing </body>.');
    html = html.replace('</body>', injection + '\\n</body>');
    document.open(); document.write(html); document.close();
  } catch (err) {
    const el=document.getElementById('bootMsg');
    el.className='err';
    el.textContent='RF-PGV bootstrap failed.\\n'+(err&&err.message?err.message:String(err));
    console.error(err);
  }
})();
</script>
</body>
</html>
